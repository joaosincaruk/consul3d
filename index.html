<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trilha da Carreira</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: calmo e aspiracional, como uma travessia noturna bem iluminada
   IDEA: a carreira como trilha que sobe por plataformas: Internato, Residência, Especialista, Consultório
   PICTURE: cena 3D com trilha de luz, plataformas hexagonais e um cristal de 4 pontas no topo
   COLOUR and TYPE: noite petróleo, luz azul-água, âmbar para o pilar a cuidar; Fraunces + Inter
   LAYOUT: a cena ocupa a tela; painel de pergunta ancorado embaixo à esquerda, abaixo da cena no celular */
:root{color-scheme:dark;--bg:#0b1d24;--ink:#e8eef1;--soft:#9fb1ba;--card:#0f262e;--line:#24505e;--aq:#7cc4d6;--amb:#e8a33d;--cor:#f08a76;--pet:#144a5a}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2{font-family:Fraunces,Georgia,serif;font-weight:300;line-height:1.08;text-wrap:balance;margin:0}
h1 em,h2 em{font-style:italic;color:var(--aq)}
.wrapS{position:relative}
.stage{position:relative;height:min(86vh,780px);min-height:520px;overflow:hidden;background:radial-gradient(120% 80% at 50% 0%,#14404e 0%,#0b1d24 60%)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.brand{position:absolute;top:18px;left:max(4vw,16px);font-size:14px;color:var(--soft);z-index:2}
.brand b{color:var(--ink);font-weight:600}
.prog{position:absolute;top:16px;right:max(4vw,16px);z-index:2;font-size:14px;color:var(--soft);text-align:right}
.prog .d{display:flex;gap:5px;justify-content:flex-end;margin-top:6px}.prog .d i{width:18px;height:4px;border-radius:2px;background:var(--line)}.prog .d i.f{background:var(--aq)}
.lbl{position:absolute;z-index:1;transform:translate(-50%,-100%);font-size:13px;font-weight:600;color:var(--ink);background:rgba(11,29,36,.7);border:1px solid var(--line);padding:4px 10px;border-radius:999px;white-space:nowrap;pointer-events:none;transition:opacity .3s}
.lbl.on{border-color:var(--aq);color:var(--aq)}.lbl.w{border-color:var(--amb);color:var(--amb)}
.panel{position:absolute;z-index:3;left:max(4vw,16px);bottom:max(4vh,18px);width:min(540px,calc(100% - 32px));background:var(--card);border:1px solid var(--line);border-radius:14px;padding:clamp(20px,3vw,30px);box-shadow:0 30px 60px -30px #000;transition:opacity .35s,transform .35s;max-height:calc(100% - 90px);overflow:auto}
.panel.out{opacity:0;transform:translateY(14px);pointer-events:none}
.kick{font-size:14px;color:var(--aq);margin:0 0 8px;font-weight:500}
.panel h1{font-size:clamp(34px,5vw,50px);margin-bottom:12px}
.panel h2{font-size:clamp(22px,2.6vw,28px);margin-bottom:18px}
.panel p{margin:0 0 14px;color:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:10px 16px;font:inherit;font-size:15px;cursor:pointer;min-height:44px}
.chip[aria-pressed=true]{background:var(--aq);border-color:var(--aq);color:#0b1d24}
.btn{background:var(--aq);color:#0b1d24;border:0;border-radius:8px;padding:14px 22px;font:600 16px Inter,sans-serif;cursor:pointer;min-height:48px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:#0b1d24;border:1px solid var(--line);border-radius:10px;padding:13px 14px;margin-bottom:8px;font:inherit;color:var(--ink);cursor:pointer;min-height:50px;transition:border-color .2s,background .2s}
.opt:hover{border-color:var(--aq)}.opt b{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--aq);display:grid;place-items:center;font-size:13px;color:var(--aq)}
.opt.sel{background:#143a46;border-color:var(--aq)}
.chip:focus-visible,.btn:focus-visible,.opt:focus-visible,input:focus-visible{outline:3px solid var(--amb);outline-offset:2px}
.score{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.score .n{font-family:Fraunces,serif;font-weight:300;font-size:clamp(64px,10vw,96px);line-height:.9;color:var(--aq);font-variant-numeric:tabular-nums}
.bar{display:grid;grid-template-columns:130px 1fr 34px;gap:10px;align-items:center;margin:8px 0;font-size:15px}
.bar .t{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar .t i{display:block;height:100%;background:var(--aq);transition:width 1s}
.bar.w .t i{background:var(--amb)}.bar em{font-style:normal;text-align:right;color:var(--soft);font-variant-numeric:tabular-nums}
.tip{border-left:3px solid var(--amb);padding:10px 14px;background:#0b1d24;border-radius:0 8px 8px 0;margin:14px 0;color:var(--ink);font-size:15px}
label{display:block;font-size:14px;font-weight:500;margin:12px 0 5px}
input{width:100%;font:16px Inter,sans-serif;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:#0b1d24;color:var(--ink);min-height:46px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 12px}
.ck{display:flex;gap:10px;align-items:flex-start;font-weight:400;color:var(--soft)}.ck input{width:20px;min-height:20px;flex:none;margin-top:2px}
.err{color:var(--cor);font-size:14px;margin:8px 0 0}.hide{display:none!important}
details{font-size:14px;color:var(--soft);margin-top:12px}pre{overflow-x:auto;background:#0b1d24;padding:10px;border-radius:8px;font-size:13px}
.foot{padding:18px max(4vw,16px);font-size:14px;color:var(--soft)}
@media(max-width:700px){.stage{height:58vh;min-height:380px}.panel{position:relative;left:auto;bottom:auto;width:auto;margin:-40px 12px 0;max-height:none}.two{grid-template-columns:minmax(0,1fr)}.bar{grid-template-columns:110px 1fr 30px}}
</style>
</head>
<body>
<div class="wrapS">
<div class="stage" id="stage">
  <div class="brand"><b>Consulthree Jovens</b> · Trilha da Carreira</div>
  <div class="prog" id="prog"></div>
  <div id="labels"></div>
</div>
<section class="panel" id="panel" aria-live="polite"></section>
</div>
<p class="foot">Protótipo. Perguntas, textos e faixas de resultado para validar com a equipe; nada é enviado.</p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
{
const $=id=>document.getElementById(id);
const P={fin:'Finanças',mer:'Mercado e carreira',pos:'Posicionamento',ges:'Gestão'};
const STAGES=[{n:'Internato',p:'mer'},{n:'Residência',p:'fin'},{n:'Especialista',p:'pos'},{n:'Consultório',p:'ges'}];
const Q=[
{p:'mer',t:'Como você está escolhendo (ou escolheu) a sua especialidade?',o:[['Pela que paga mais hoje.',1],['Pela indicação da família ou de professores.',0],['Pelo que gosto na prática, cruzado com a demanda de onde quero viver.',3],['Vou decidir quando chegar a hora.',0]]},
{p:'mer',t:'Daqui a 5 anos, você sabe onde quer atender e para quem?',o:[['Sim: cidade, perfil de paciente e modelo de atuação.',3],['Tenho uma ideia geral.',2],['Vou para onde aparecer oportunidade.',1],['Nunca parei para pensar.',0]]},
{p:'fin',t:'Primeiro mês de plantões como PJ: o dinheiro caiu na conta. O que você faz primeiro?',o:[['Pago as contas do mês e vejo o que sobra.',1],['Separo os impostos e começo uma reserva antes de gastar.',3],['Aplico tudo numa oportunidade que um colega indicou.',0],['Deixo parado e resolvo depois com o contador.',2]]},
{p:'fin',t:'Um hospital oferece contratar você como PJ. Antes de aceitar, o que você compara?',o:[['Só o valor bruto do plantão.',0],['O valor líquido, depois de impostos e do custo de manter o CNPJ.',3],['Se os colegas também aceitaram.',1],['Se dá para receber como pessoa física.',1]]},
{p:'pos',t:'Se um paciente procurar o seu nome no Google ou no Instagram hoje, ele encontra:',o:[['Nada, ou só o meu perfil pessoal.',0],['Meu nome e a especialidade, sem muito mais.',1],['Conteúdo, mas sem uma linha clara.',2],['Quem eu sou, o que eu trato e como agendar.',3]]},
{p:'pos',t:'Como você constrói a sua rede de contatos na medicina?',o:[['Conheço quem aparece no plantão e na faculdade.',1],['Cuido de forma ativa: preceptores, outras especialidades, eventos.',3],['Só pelas redes sociais.',1],['Ainda não penso nisso.',0]]},
{p:'ges',t:'No seu primeiro consultório, o que define se ele dá lucro?',o:[['Ter muitos pacientes.',1],['Aceitar todos os convênios.',0],['Conhecer o custo fixo, o valor médio da consulta e a taxa de faltas.',3],['Ter uma boa secretária.',1]]},
{p:'ges',t:'Na hora de assinar contrato com uma clínica ou hospital, você:',o:[['Confio na indicação e assino.',0],['Leio por cima.',1],['Peço para alguém revisar, mas não negocio.',2],['Leio tudo e negocio repasse, prazos e exclusividade.',3]]}];
const PLAN={fin:'organizar impostos, reserva e a diferença entre bruto e líquido',mer:'cruzar afinidade com demanda e desenhar onde quer estar em 5 anos',pos:'construir presença digital ética e uma rede de contatos ativa',ges:'entender custos, preço da consulta e como ler um contrato'};
const M=['Estudante','Internato','Residente','Recém-especialista'];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let mom=null,k=0,pts={fin:0,mer:0,pos:0,ges:0},res=null;

/* ---------- cena 3D ---------- */
const gl=!!window.THREE;let api={focus(){},light(){},summit(){},labels(){}};
if(gl){
  const T=THREE,V=T.Vector3,stage=$('stage');
  const renderer=new T.WebGLRenderer({antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));stage.prepend(renderer.domElement);
  const scene=new T.Scene();scene.fog=new T.Fog(0x0b1d24,14,46);
  const cam=new T.PerspectiveCamera(48,1,.1,200);
  scene.add(new T.HemisphereLight(0x9fdcec,0x0b1d24,.75));
  const sun=new T.DirectionalLight(0xffffff,.7);sun.position.set(6,12,8);scene.add(sun);
  const grid=new T.GridHelper(90,90,0x1d6a80,0x12343f);grid.position.y=-1.4;scene.add(grid);
  const pts3=[new V(0,0,9),new V(-4,1.1,3),new V(3,2.3,-3),new V(-3,3.5,-9),new V(3,4.7,-15),new V(0,6.6,-21.5)];
  const curve=new T.CatmullRomCurve3(pts3);
  const tube=new T.Mesh(new T.TubeGeometry(curve,200,.035,6,false),new T.MeshBasicMaterial({color:0x24505e}));scene.add(tube);
  const dotG=new T.SphereGeometry(.07,8,8),dim=new T.MeshBasicMaterial({color:0x2b6a7d}),lit=new T.MeshBasicMaterial({color:0x7cc4d6});
  const dots=[];for(let i=0;i<150;i++){const t=i/149,m=new T.Mesh(dotG,dim);m.position.copy(curve.getPoint(t)).add(new V(0,.08,0));m.userData.t=t;scene.add(m);dots.push(m)}
  const plats=[];
  STAGES.forEach((s,i)=>{
    const p=curve.getPoint((i+1)/5),g=new T.Group();g.position.copy(p);
    const hex=new T.Mesh(new T.CylinderGeometry(1.35,1.55,.3,6),new T.MeshStandardMaterial({color:0x144a5a,roughness:.55,metalness:.2,flatShading:true}));hex.position.y=-.22;g.add(hex);
    const edge=new T.LineSegments(new T.EdgesGeometry(hex.geometry),new T.LineBasicMaterial({color:0x7cc4d6,transparent:true,opacity:.6}));edge.position.copy(hex.position);g.add(edge);
    const orbM=new T.MeshStandardMaterial({color:0x1d6a80,emissive:0x0b2a33,roughness:.25,metalness:.1});
    const orb=new T.Mesh(new T.IcosahedronGeometry(.36,1),orbM);orb.position.y=1.15;g.add(orb);
    const ring=new T.Mesh(new T.TorusGeometry(.62,.025,8,48),new T.MeshBasicMaterial({color:0x7cc4d6,transparent:true,opacity:.5}));ring.position.y=1.15;ring.rotation.x=Math.PI/2.4;g.add(ring);
    const pl=new T.PointLight(0x7cc4d6,0,6);pl.position.y=1.4;g.add(pl);
    scene.add(g);plats.push({g,orb,orbM,ring,pl,top:p.clone().add(new V(0,2,0))});
  });
  const pg=new T.BufferGeometry(),arr=new Float32Array(1200);for(let i=0;i<1200;i+=3){arr[i]=(Math.random()-.5)*40;arr[i+1]=Math.random()*14-1;arr[i+2]=-Math.random()*44+12}
  pg.setAttribute('position',new T.BufferAttribute(arr,3));const dust=new T.Points(pg,new T.PointsMaterial({color:0x7cc4d6,size:.05,transparent:true,opacity:.55}));scene.add(dust);
  const summit=pts3[5].clone(),crystal=new T.Group();crystal.position.copy(summit).add(new V(0,1.2,0));scene.add(crystal);
  const core=new T.Mesh(new T.IcosahedronGeometry(.42,0),new T.MeshStandardMaterial({color:0xd9eaef,emissive:0x1d6a80,emissiveIntensity:.6,flatShading:true,roughness:.2}));crystal.add(core);
  const DIRS=[new V(1,.25,0),new V(0,.25,1),new V(-1,.25,0),new V(0,.25,-1)].map(d=>d.normalize());
  const arms=Object.keys(P).map((key,i)=>{const m=new T.Mesh(new T.ConeGeometry(.3,1,6),new T.MeshStandardMaterial({color:0x7cc4d6,emissive:0x144a5a,transparent:true,opacity:.9,roughness:.15,metalness:.25,flatShading:true}));
    m.quaternion.setFromUnitVectors(new V(0,1,0),DIRS[i]);m.scale.set(1,.01,1);crystal.add(m);return {m,key,dir:DIRS[i],len:.01,target:.01}});
  const sl=new T.PointLight(0xe8a33d,0,10);sl.position.copy(summit).add(new V(0,3,2));scene.add(sl);
  const camPos=new V(9,9.5,14),look=new V(0,3,-6),lookT=look.clone(),camT=camPos.clone();cam.position.copy(camPos);
  let progT=0,progTarget=0,showSummit=false;
  api.focus=i=>{const p=curve.getPoint((i+1)/5);camT.copy(p).add(new V(1.6,2.5,5.6));lookT.copy(p).add(new V(0,.7,-1));progTarget=(i+1)/5-.03};
  api.light=(i,r)=>{const pl=plats[i],c=new T.Color(r>=.67?0x7cc4d6:r>=.34?0xe8a33d:0xf08a76);pl.orbM.color.copy(c);pl.orbM.emissive.copy(c).multiplyScalar(.55);pl.ring.material.color.copy(c);pl.pl.color.copy(c);pl.pl.intensity=1.4;pl.done=true};
  api.summit=(by,weak)=>{showSummit=true;progTarget=1;camT.copy(summit).add(new V(0,2.6,7.2));lookT.copy(summit).add(new V(0,1.2,0));sl.intensity=1.2;
    arms.forEach(a=>{a.target=.7+by[a.key]/6*2.1;if(a.key===weak){a.m.material.color.set(0xe8a33d);a.m.material.emissive.set(0x5a3a10)}})};
  const labels=$('labels');
  const L=[...STAGES.map((s,i)=>({el:null,txt:s.n,pos:()=>plats[i].top,cls:()=>plats[i].done?'on':''})),
           ...arms.map(a=>({el:null,txt:P[a.key],pos:()=>crystal.localToWorld(a.dir.clone().multiplyScalar(a.len+.5)),cls:()=>a.m.material.color.getHex()===0xe8a33d?'w':'on',summit:1}))];
  L.forEach(l=>{l.el=document.createElement('div');l.el.className='lbl';l.el.textContent=l.txt;labels.appendChild(l.el)});
  const size=()=>{const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()};
  const ro=new ResizeObserver(size);ro.observe(stage);size();
  const clock=new T.Clock();
  (function loop(){
    const t=clock.getElapsedTime(),f=reduce?1:.045;
    cam.position.lerp(camT,f);look.lerp(lookT,f*1.1);cam.lookAt(look);
    progT+=(progTarget-progT)*(reduce?1:.04);dots.forEach(d=>d.material=d.userData.t<=progT?lit:dim);
    plats.forEach((p,i)=>{p.ring.rotation.z=t*.6+i;p.orb.rotation.y=t*.5;p.orb.position.y=1.15+(reduce?0:Math.sin(t*1.3+i)*.06)});
    if(!reduce)dust.rotation.y=t*.01;
    crystal.rotation.y=reduce?.6:t*.35;
    arms.forEach(a=>{a.len+=(a.target-a.len)*(reduce?1:.035);a.m.scale.set(1,a.len,1);a.m.position.copy(a.dir).multiplyScalar(a.len/2+.25)});
    renderer.render(scene,cam);
    const w=stage.clientWidth,h=stage.clientHeight;
    L.forEach(l=>{const v=l.pos().project(cam),vis=v.z<1&&(!l.summit||showSummit);l.el.style.opacity=vis?1:0;
      l.el.style.left=(v.x+1)/2*w+'px';l.el.style.top=(1-v.y)/2*h+'px';l.el.className='lbl '+l.cls()});
    requestAnimationFrame(loop);
  })();
}

/* ---------- painel ---------- */
const panel=$('panel');
const swap=html=>new Promise(r=>{panel.classList.add('out');setTimeout(()=>{panel.innerHTML=html;panel.classList.remove('out');r()},reduce?0:350)});
const prog=()=>{$('prog').innerHTML=k<Q.length?`${STAGES[Math.floor(k/2)].n} · pergunta ${k+1} de ${Q.length}<div class="d">${Q.map((_,i)=>`<i class="${i<k?'f':''}"></i>`).join('')}</div>`:'Topo da trilha'};
panel.innerHTML=`<p class="kick">Consulthree Jovens</p><h1>Até onde a sua carreira <em>já subiu?</em></h1>
<p>Quatro plataformas, oito perguntas, uns 3 minutos. No topo, um cristal mostra a força de cada pilar da sua carreira: finanças, mercado, posicionamento e gestão.</p>
<p style="color:var(--ink);font-weight:500;margin-bottom:10px">Em que momento você está?</p>
<div class="chips" id="moment">${M.map(m=>`<button class="chip" aria-pressed="false" data-m="${m}">${m}</button>`).join('')}</div>
<button class="btn" id="start" disabled>Começar a subida</button>${gl?'':'<p class="err">A cena 3D não carregou neste navegador; o diagnóstico funciona mesmo assim.</p>'}`;
$('moment').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;mom=b.dataset.m;[...$('moment').children].forEach(c=>c.setAttribute('aria-pressed',c===b));$('start').disabled=false});
$('start').onclick=()=>{api.focus(0);ask()};

async function ask(){
  prog();const q=Q[k],s=STAGES[Math.floor(k/2)];
  await swap(`<p class="kick">${s.n} · ${P[q.p]}</p><h2>${q.t}</h2>${q.o.map((o,i)=>`<button class="opt" data-i="${i}"><b>${'ABCD'[i]}</b><span>${o[0]}</span></button>`).join('')}`);
  panel.querySelector('.opt').focus({preventScroll:true});
  panel.onclick=e=>{const b=e.target.closest('.opt');if(!b)return;panel.onclick=null;b.classList.add('sel');answer(+b.dataset.i)};
}
function answer(i){
  const q=Q[k];pts[q.p]+=q.o[i][1];k++;
  setTimeout(()=>{
    if(k%2===0){const si=k/2-1;api.light(si,pts[STAGES[si].p]/6);if(k<Q.length)api.focus(si+1)}
    if(k<Q.length)setTimeout(ask,k%2===0&&!reduce?700:0);else finish();
  },reduce?0:260);
}
async function finish(){
  const tot=Object.values(pts).reduce((a,b)=>a+b,0),pct=Math.round(tot/24*100),weak=Object.keys(pts).sort((a,b)=>pts[a]-pts[b])[0];
  const prof=tot>=17?'Rota de alta performance':tot>=10?'Rota em construção':'Rota no piloto automático';
  res={tot,pct,weak,prof};prog();api.summit(pts,weak);
  await swap(`<p class="kick">Topo da trilha</p><div class="score"><span class="n">${pct}%</span><h2 style="margin:0">${prof}</h2></div>
  ${Object.keys(P).map(key=>`<div class="bar ${key===weak?'w':''}"><span>${P[key]}</span><div class="t"><i style="width:0" data-w="${pts[key]/6*100}"></i></div><em>${pts[key]}/6</em></div>`).join('')}
  <div class="tip"><b>Ponta a fortalecer: ${P[weak]}.</b> O relatório completo mostra como ${PLAN[weak]}.</div>
  <form id="fm" novalidate>
    <div class="two"><div><label for="f-nome">Nome</label><input id="f-nome" autocomplete="name"></div><div><label for="f-wa">WhatsApp com DDD</label><input id="f-wa" inputmode="tel" autocomplete="tel"></div></div>
    <div class="two"><div><label for="f-mail">E-mail</label><input id="f-mail" type="email" autocomplete="email"></div><div><label for="f-inst">Faculdade ou instituição</label><input id="f-inst"></div></div>
    <label class="ck"><input type="checkbox" id="f-ok"> Aceito receber o relatório e conteúdos da Consulthree por e-mail e WhatsApp.</label>
    <p class="err hide" id="err" role="alert">Preencha nome, WhatsApp, e-mail e o aceite.</p>
    <button class="btn" style="width:100%;margin-top:14px">Receber meu relatório completo</button>
  </form>`);
  setTimeout(()=>panel.querySelectorAll('.bar .t i').forEach(i=>i.style.width=i.dataset.w+'%'),80);
  $('fm').addEventListener('submit',e=>{
    e.preventDefault();const v=id=>$(id).value.trim();
    const ok=v('f-nome')&&v('f-wa').replace(/\D/g,'').length>=10&&/\S+@\S+\.\S+/.test(v('f-mail'))&&$('f-ok').checked;
    $('err').classList.toggle('hide',!!ok);if(!ok)return;
    const lead={origem:'trilha-3d',momento:mom,nome:v('f-nome'),whatsapp:v('f-wa'),email:v('f-mail'),instituicao:v('f-inst'),percentual:res.pct,pilares:pts,pilar_fraco:res.weak,perfil:res.prof,ref:location.hash.slice(1)||null};
    $('fm').outerHTML=`<p style="color:var(--ink)">Pronto! O relatório com o plano para <b>${P[res.weak]}</b> vai para o seu WhatsApp, e a equipe da Consulthree Jovens entra em contato.</p><details><summary>Dados que iriam para o CRM (protótipo)</summary><pre id="json"></pre></details>`;
    $('json').textContent=JSON.stringify(lead,null,2);
  });
}
}
</script>
