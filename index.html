<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trilha da Carreira | Consulthree Jovens</title>
<meta name="description" content="Quatro fases, oito perguntas difíceis sobre a carreira que a faculdade não ensina.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: calmo e aspiracional, um jogo de fases sério
   IDEA: a carreira como trilha de ECG que liga quatro placas de Petri, cada uma com um objeto da medicina
   PICTURE: estetoscópio, coração com ECG, DNA e clínica; no topo, o coração da marca com 4 barras de resultado
   COLOUR and TYPE: noite petróleo, luz azul-água, âmbar para o pilar a cuidar, coral só no coração; Fraunces + Inter
   LAYOUT: cena em tela cheia, trilha de fases no topo, painel embaixo à esquerda (abaixo da cena no celular) */
:root{color-scheme:dark;--bg:#0b1d24;--ink:#e8eef1;--soft:#9fb1ba;--card:#0f262e;--line:#24505e;--aq:#7cc4d6;--amb:#e8a33d;--cor:#f08a76;--pet:#144a5a}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2{font-family:Fraunces,Georgia,serif;font-weight:300;line-height:1.08;text-wrap:balance;margin:0}
h1 em,h2 em{font-style:italic;color:var(--aq)}
.wrapS{position:relative}
.stage{position:relative;height:min(88vh,800px);min-height:540px;overflow:hidden;background:radial-gradient(120% 80% at 50% 0%,#14404e 0%,#0b1d24 62%)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage.hov canvas{cursor:pointer}
.brand{position:absolute;top:18px;left:max(4vw,16px);font-size:14px;color:var(--soft);z-index:2}
.brand b{color:var(--ink);font-weight:600}
.phases{position:absolute;top:14px;right:max(4vw,16px);z-index:2;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:62%}
.ph{font-size:13px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);color:var(--soft);background:rgba(11,29,36,.6);transition:all .3s}
.ph.active{border-color:var(--aq);color:var(--aq)}
.ph.done{background:var(--aq);border-color:var(--aq);color:#0b1d24}
.ph.done.w{background:var(--amb);border-color:var(--amb)}
.lbl{position:absolute;z-index:1;transform:translate(-50%,-100%);font-size:13px;font-weight:600;color:var(--soft);background:rgba(11,29,36,.72);border:1px solid var(--line);padding:4px 10px;border-radius:999px;white-space:nowrap;pointer-events:none;transition:opacity .3s,color .3s,border-color .3s}
.lbl.active{color:var(--aq);border-color:var(--aq)}.lbl.done{color:var(--ink);border-color:var(--aq)}.lbl.w{color:var(--amb);border-color:var(--amb)}
.tip3{position:absolute;z-index:4;pointer-events:none;background:#0f262e;border:1px solid var(--aq);color:var(--ink);font-size:14px;padding:8px 12px;border-radius:10px;transform:translate(14px,14px);opacity:0;transition:opacity .15s;box-shadow:0 12px 30px -12px #000;white-space:nowrap}
.tip3.on{opacity:1}.tip3 b{display:block;color:var(--aq);font-weight:600}
.toast{position:absolute;z-index:4;left:50%;top:22%;transform:translate(-50%,0);background:rgba(15,38,46,.92);border:1px solid var(--aq);border-radius:14px;padding:14px 22px;text-align:center;opacity:0;pointer-events:none}
.toast small{display:block;color:var(--aq);font-size:13px;font-weight:600}
.toast span{font-family:Fraunces,serif;font-size:clamp(24px,3vw,32px);font-weight:300}
.toast.show{animation:toast 2.2s ease forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,12px) scale(.96)}12%,75%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-10px)}}
.panel{position:absolute;z-index:3;left:max(4vw,16px);bottom:max(4vh,18px);width:min(540px,calc(100% - 32px));background:var(--card);border:1px solid var(--line);border-radius:14px;padding:clamp(20px,3vw,30px);box-shadow:0 30px 60px -30px #000;transition:opacity .35s,transform .35s;max-height:calc(100% - 100px);overflow:auto}
.panel.out{opacity:0;transform:translateY(14px);pointer-events:none}
.kick{font-size:14px;color:var(--aq);margin:0 0 8px;font-weight:500;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.kick span{color:var(--soft);font-weight:400}
.panel h1{font-size:clamp(34px,5vw,50px);margin-bottom:12px}
.panel h2{font-size:clamp(21px,2.4vw,26px);margin-bottom:16px}
.panel p{margin:0 0 14px;color:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:10px 16px;font:inherit;font-size:15px;cursor:pointer;min-height:44px;transition:border-color .2s,transform .2s}
.chip:hover{border-color:var(--aq);transform:translateY(-1px)}
.chip[aria-pressed=true]{background:var(--aq);border-color:var(--aq);color:#0b1d24}
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--aq);color:#0b1d24;border:0;border-radius:8px;padding:14px 22px;font:600 16px Inter,sans-serif;cursor:pointer;min-height:48px;text-decoration:none;transition:transform .15s,box-shadow .2s}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 24px -10px var(--aq)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.opt{position:relative;display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:#0b1d24;border:1px solid var(--line);border-radius:10px;padding:13px 14px;margin-bottom:8px;font:inherit;font-size:15.5px;color:var(--ink);cursor:pointer;min-height:50px;transition:border-color .2s,background .2s,transform .2s,box-shadow .2s;overflow:hidden}
.opt::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(124,196,214,.13) 50%,transparent 70%);transform:translateX(-100%);transition:transform .6s}
.opt:hover{border-color:var(--aq);transform:translateX(4px);box-shadow:0 8px 22px -14px var(--aq)}
.opt:hover::after{transform:translateX(100%)}
.opt b{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--aq);display:grid;place-items:center;font-size:13px;color:var(--aq);transition:background .2s,color .2s}
.opt:hover b{background:var(--aq);color:#0b1d24}
.opt.sel{background:#143a46;border-color:var(--aq)}
.chip:focus-visible,.btn:focus-visible,.opt:focus-visible,input:focus-visible{outline:3px solid var(--amb);outline-offset:2px}
.big{font-family:Fraunces,serif;font-weight:300;font-size:clamp(56px,8vw,80px);line-height:1;color:var(--aq);font-variant-numeric:tabular-nums}
.big small{font-size:.32em;color:var(--soft);font-family:Inter,sans-serif}
input[type=range]{width:100%;accent-color:var(--aq);height:36px;margin:6px 0 2px}
.ticks{display:flex;justify-content:space-between;font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums;margin-bottom:16px}
.score{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:4px}
.bar{display:grid;grid-template-columns:140px 1fr 40px;gap:10px;align-items:center;margin:8px 0;font-size:15px}
.bar .t{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar .t i{display:block;height:100%;background:var(--aq);transition:width 1s}
.bar.w .t i{background:var(--amb)}.bar em{font-style:normal;text-align:right;color:var(--soft);font-variant-numeric:tabular-nums}
.tip{border-left:3px solid var(--amb);padding:10px 14px;background:#0b1d24;border-radius:0 8px 8px 0;margin:14px 0;color:var(--ink);font-size:15px}
label{display:block;font-size:14px;font-weight:500;margin:12px 0 5px}
input[type=text],input[type=email],input[type=tel]{width:100%;font:16px Inter,sans-serif;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:#0b1d24;color:var(--ink);min-height:46px;transition:border-color .2s}
input[type=text]:hover,input[type=email]:hover,input[type=tel]:hover{border-color:var(--aq)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 12px}
.ck{display:flex;gap:10px;align-items:flex-start;font-weight:400;color:var(--soft)}.ck input{width:20px;min-height:20px;flex:none;margin-top:2px}
.err{color:var(--cor);font-size:14px;margin:8px 0 0}.hide{display:none!important}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.unl h3{font-size:16px;color:var(--aq);margin:16px 0 4px;font-weight:600}
.unl ol{margin:0;padding-left:20px;color:var(--ink);font-size:15px}.unl li{margin-bottom:8px}
.unl .g li{white-space:pre-line;color:var(--soft)}.unl .g li b{color:var(--ink)}
.foot{padding:18px max(4vw,16px);font-size:14px;color:var(--soft)}
@media(max-width:700px){.stage{height:58vh;min-height:400px}.panel{position:relative;left:auto;bottom:auto;width:auto;margin:-40px 12px 0;max-height:none}.two{grid-template-columns:minmax(0,1fr)}.bar{grid-template-columns:116px 1fr 36px}.phases{max-width:70%}.ph{font-size:13px;padding:4px 9px}.brand{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>
{

};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P={fin:'Finanças',mer:'Mercado e carreira',pos:'Posicionamento',ges:'Gestão'};
const PHASES=[{n:'Finanças',p:'fin',obj:'Coração no plantão'},{n:'Mercado e carreira',p:'mer',obj:'Estetoscópio'},{n:'Posicionamento',p:'pos',obj:'Seu DNA profissional'},{n:'Gestão',p:'ges',obj:'A sua clínica'}];
const M=['Estudante','Internato','Residente','Recém-especialista'];
const Q=[
{id:'fin1',p:'fin',t:'Seu CNPJ de serviços médicos está no Simples Nacional. O que mais influencia a alíquota que você paga?',o:[['O número de plantões que você faz por mês.',0],['A cidade onde o CNPJ foi aberto.',1],['Se você atende por convênio ou particular.',0],['A proporção entre o seu pró-labore e o faturamento da empresa.',3]],c:'No Simples, serviço médico cai no Anexo III ou no V conforme o Fator R. Com folha e pró-labore a partir de 28% do faturamento, a alíquota inicial cai de 15,5% para 6%.'},
{id:'fin2',p:'fin',t:'Um colega sugere abrir um MEI para receber os plantões e pagar menos imposto. O que você responde?',o:[['Funciona, desde que o faturamento fique abaixo do limite anual do MEI.',1],['Medicina não pode ser MEI: o caminho é outro tipo de empresa.',3],['Boa ideia, desde que o hospital aceite nota fiscal de MEI.',0],['Vale a pena só no primeiro ano, enquanto a renda é menor.',0]],c:'Medicina é profissão regulamentada e não pode ser MEI, seja qual for o faturamento. O caminho costuma ser uma empresa no Simples ou no Lucro Presumido, com contador.'},
{id:'mer1',p:'mer',t:'Você gosta igualmente de duas especialidades. Qual dado de mercado deveria pesar mais na escolha?',o:[['A remuneração média dos especialistas no país.',1],['O número de vagas de residência e a nota de corte.',1],['Quantos especialistas já atendem na região onde você quer viver, comparado à demanda de lá.',3],['O quanto os médicos da área crescem nas redes sociais.',0]],c:'A média nacional esconde a realidade local. O que decide a sua agenda é a concorrência e a demanda na região onde você vai atender.'},
{id:'mer2',p:'mer',t:'Recém-especialista, você tem três propostas. Qual tende a construir mais carreira em 5 anos?',o:[['Ambulatório da sua especialidade, pagando menos, numa clínica com fluxo de pacientes e rede de indicação.',3],['Plantões com o maior valor por hora, num hospital sem relação com a sua especialidade.',1],['Vínculo estável num hospital público, fora da especialidade.',1],['Dividir a semana entre as três para não fechar nenhuma porta.',1]],c:'Valor por hora alto fora da especialidade paga as contas, mas não constrói nome, rede nem pacientes próprios.'},
{id:'pos1',p:'pos',t:'Seu Instagram tem 8 mil seguidores, mas a agenda não enche. Qual é a causa mais provável?',o:[['Ainda são poucos seguidores: a agenda enche lá pelos 30 mil.',0],['Falta frequência: o ideal é postar todos os dias.',1],['Quem segue você não é quem pode marcar consulta: outra cidade, estudantes, colegas.',3],['Falta investir em anúncios para impulsionar os posts.',1]],c:'Seguidor não é paciente. Se quem acompanha você mora longe ou é colega, o perfil cresce e a agenda não.'},
{id:'pos2',p:'pos',t:'Ao comparar três especialistas no Google, o que costuma pesar mais para o paciente escolher?',o:[['Avaliações recentes, foto profissional e informação clara de onde e como agendar.',3],['Currículo completo, com títulos, mestrado e congressos em destaque.',1],['O número de seguidores no Instagram.',0],['O preço mais baixo da consulta.',1]],c:'Na hora de escolher, o paciente olha prova social recente e facilidade para agendar. Títulos ajudam, mas raramente decidem sozinhos.'},
{id:'cons',p:'ges',slider:1,t:'Custo fixo do consultório: R$ 12 mil por mês. Consulta: R$ 400, e 15% de cada uma vai para impostos e taxas. Quantas consultas por mês você precisa só para cobrir o custo fixo?',c:'Com 15% de impostos e taxas, cada consulta deixa R$ 340. R$ 12.000 ÷ R$ 340 = 35,3: são 36 consultas só para empatar o custo fixo. Quem esquece os impostos responde 30.'},
{id:'ges2',p:'ges',t:'Uma clínica oferece 60% de repasse, pagamento em 60 dias e exclusividade na cidade. O que mais pesa na sua carreira a longo prazo?',o:[['O percentual de 60%.',1],['A exclusividade na cidade.',3],['O prazo de 60 dias para receber.',1],['Nada disso: são condições padrão do mercado.',0]],c:'Percentual e prazo se renegociam. A exclusividade pode impedir você de abrir o próprio consultório ou atender em outro lugar por anos.'}];
const BREAK=Math.ceil(CONFIG.CUSTO_FIXO/(CONFIG.CONSULTA*(1-CONFIG.TAXAS)));
const consPts=v=>v===BREAK?3:Math.abs(v-BREAK)===1?2:v===CONFIG.CUSTO_FIXO/CONFIG.CONSULTA?1:0;
const DIAG={
 fin:{d:'O dinheiro entra, mas a estrutura por trás dele ainda não está montada. É aqui que o jovem médico mais perde sem perceber: imposto mal planejado e CNPJ no formato errado.',rx:['Simular com um contador o Simples com e sem Fator R','Separar imposto e reserva no dia em que o dinheiro cai','Comparar toda proposta pelo valor líquido, nunca pelo bruto']},
 mer:{d:'As escolhas de carreira estão sendo feitas com dados que não respondem à pergunta certa. Especialidade e propostas precisam ser lidas pelo mercado onde você vai atuar.',rx:['Mapear especialistas e demanda na cidade onde você quer atender','Priorizar propostas que constroem pacientes e indicação na especialidade','Escrever onde quer estar em 5 anos e checar cada proposta contra isso']},
 pos:{d:'A presença digital pode até crescer, mas não está virando consulta. Falta falar com o paciente certo e facilitar o agendamento.',rx:['Revisar quem segue você: cidade, perfil, se pode virar paciente','Completar o perfil do Google com fotos, endereço e agendamento','Produzir conteúdo para o seu público dentro da Res. CFM 2.336/2023']},
 ges:{d:'Os números do consultório ainda não estão na sua mão. Sem ponto de equilíbrio e sem ler o que cada contrato amarra, a decisão fica no feeling.',rx:['Calcular o ponto de equilíbrio já com impostos e taxas','Ler cláusulas de exclusividade e prazo antes de assinar','Acompanhar consultas, faltas e valor médio todo mês']}};
const STAMP={estavel:'Apto',atencao:'Observação',critico:'Risco'};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const qs=new URLSearchParams(location.search),utm={};
['utm_source','utm_medium','utm_campaign','utm_term','utm_content','utm_id','fbclid','ref'].forEach(k=>{const v=qs.get(k);if(v)utm[k]=v});
window.dataLayer=window.dataLayer||[];const track=(event,data={})=>window.dataLayer.push({event,...data});
let mom=null,k=0,ans={},revealed=false,cons=20,pts={fin:0,mer:0,pos:0,ges:0},res=null,phaseState=['locked','locked','locked','locked'];

/* ---------- HUD ---------- */
function hud(){$('phases').innerHTML=PHASES.map((f,i)=>{const st=phaseState[i],w=revealed&&st==='done'&&pts[f.p]<4?' w':'';return `<span class="ph ${st}${w}">${i+1}. ${f.n}</span>`}).join('')}
hud();
function toast(a,b){const t=$('toast');t.querySelector('small').textContent=a;t.querySelector('span').textContent=b;t.classList.remove('show');void t.offsetWidth;t.classList.add('show')}

/* ---------- cena 3D ---------- */
const gl=!!window.THREE;let api={focus(){},state(){},summit(){},reveal(){},boost(){}};
if(gl){
  const T=THREE,V=T.Vector3,stage=$('stage');
  const renderer=new T.WebGLRenderer({antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));stage.prepend(renderer.domElement);
  const scene=new T.Scene();scene.fog=new T.Fog(0x0b1d24,14,48);
  const cam=new T.PerspectiveCamera(46,1,.1,200);
  scene.add(new T.HemisphereLight(0xbfe6f0,0x0b1d24,.8));
  const sun=new T.DirectionalLight(0xffffff,.8);sun.position.set(5,12,9);scene.add(sun);
  const rim=new T.DirectionalLight(0x7cc4d6,.5);rim.position.set(-8,4,-6);scene.add(rim);
  const STD=(c,o={})=>new T.MeshStandardMaterial(Object.assign({color:c,roughness:.35,metalness:.15},o));

  /* trilha em forma de ECG */
  const pts3=[new V(0,0,9),new V(-4,1.1,3),new V(3,2.3,-3),new V(-3,3.5,-9),new V(3,4.7,-15),new V(0,6.6,-21.5)];
  const curve=new T.CatmullRomCurve3(pts3);
  const ecgPts=[],N=600;
  for(let i=0;i<=N;i++){const t=i/N,p=curve.getPoint(t),u=(t*30)%1;
    const spike=u>.46&&u<.5?(u-.46)*20:u>=.5&&u<.54?(.54-u)*20-0.25:u>.62&&u<.7?Math.sin((u-.62)/.08*Math.PI)*.15:0;
    ecgPts.push(p.x,p.y+.06+spike*.55,p.z)}
  const ecgGeo=new T.BufferGeometry();ecgGeo.setAttribute('position',new T.Float32BufferAttribute(ecgPts,3));
  const ecgDim=new T.Line(ecgGeo,new T.LineBasicMaterial({color:0x24505e}));scene.add(ecgDim);
  const ecgLit=new T.Line(ecgGeo,new T.LineBasicMaterial({color:0x7cc4d6}));ecgLit.geometry.setDrawRange(0,0);scene.add(ecgLit);
  const pulse=new T.Mesh(new T.SphereGeometry(.09,12,12),new T.MeshBasicMaterial({color:0xe8a33d}));scene.add(pulse);

  /* formas médicas */
  const plus=(a,b)=>{const s=new T.Shape();[[-a,b],[a,b],[a,a],[b,a],[b,-a],[a,-a],[a,-b],[-a,-b],[-a,-a],[-b,-a],[-b,a],[-a,a]].forEach(([x,y],i)=>i?s.lineTo(x,y):s.moveTo(x,y));s.closePath();return s};
  const crossGeo=new T.ExtrudeGeometry(plus(.12,.36),{depth:.12,bevelEnabled:true,bevelThickness:.03,bevelSize:.03,bevelSegments:2});crossGeo.center();
  const heartShape=(()=>{const h=new T.Shape();h.moveTo(5,5);h.bezierCurveTo(5,5,4,0,0,0);h.bezierCurveTo(-6,0,-6,7,-6,7);h.bezierCurveTo(-6,11,-3,15.4,5,19);h.bezierCurveTo(12,15.4,16,11,16,7);h.bezierCurveTo(16,7,16,0,10,0);h.bezierCurveTo(7,0,5,5,5,5);return h})();
  const heartGeo=s=>{const g=new T.ExtrudeGeometry(heartShape,{depth:4,bevelEnabled:true,bevelThickness:1.4,bevelSize:1.1,bevelSegments:4,curveSegments:28});g.center();g.scale(s,s,s);g.rotateZ(Math.PI);return g};
  const capsuleGeo=(()=>{const r=.09,h=.16,p=[];for(let i=0;i<=8;i++){const a=-Math.PI/2+i/8*Math.PI/2;p.push(new T.Vector2(Math.cos(a)*r,-h/2+Math.sin(a)*r))}for(let i=0;i<=8;i++){const a=i/8*Math.PI/2;p.push(new T.Vector2(Math.cos(a)*r,h/2+Math.sin(a)*r))}return new T.LatheGeometry(p,16)})();

  function stethoscope(){const g=new T.Group(),mt=STD(0x7cc4d6,{emissive:0x0b2a33}),metal=STD(0xd9eaef,{metalness:.9,roughness:.22});
    const tube=(arr,r)=>new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3(arr.map(a=>new V(...a))),48,r,10,false),mt);

  await swap(`<p class="kick">Seu resultado<span>${esc(mom)}</span></p>
  <div class="score"><span class="big">${res.total}<small> de 24</small></span><h2 style="margin:0">${STAMP[res.status]}</h2></div>
  <p style="margin:0 0 6px">Resposta mais forte em <b style="color:var(--ink)">${res.best} de 8</b> perguntas. A cópia do laudo vai para <b style="color:var(--ink)">${esc(payload.email)}</b>.</p>
  ${Object.keys(P).map(key=>`<div class="bar ${key===res.weak?'w':''}"><span>${P[key]}</span><div class="t"><i style="width:0" data-w="${pts[key]/6*100}"></i></div><em>${pts[key]}/6</em></div>`).join('')}
  <div class="unl"><div class="tip"><b>Pilar a cuidar: ${P[res.weak]}.</b> ${esc(dg.d)}</div>
    <h3>Prescrição</h3><ol>${dg.rx.map(t=>`<li>${esc(t)}</li>`).join('')}</ol>
    <h3>Gabarito comentado</h3><ol class="g">${res.gab.map(t=>{const [a,...b]=t.split('\n');return `<li><b>${esc(a.replace(/^\d+\.\s/,''))}</b>\n${esc(b.join('\n'))}</li>`}).join('')}</ol>
    <a class="btn" style="width:100%;margin-top:12px" href="https://wa.me/${CONFIG.WHATSAPP}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">Conversar sobre o resultado no WhatsApp</a></div>`);
  setTimeout(()=>panel.querySelectorAll('.bar .t i').forEach(i=>i.style.width=i.dataset.w+'%'),80);
}
}
</script>
